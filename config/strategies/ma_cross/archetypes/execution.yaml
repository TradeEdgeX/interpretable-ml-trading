# Textbook ATR trail. Demo defaults — not a promote lock.
add_position:
  add_size_multipliers: []
  inherit_parent_stop: true
  min_current_r_by_add: []
  min_current_r_unit: atr
  sizing_mode: fixed_multiplier
  trigger:
    type: float_r_ladder_only
execution_constraints:
  allow_add_on: false
  min_order_interval_minutes: 60
holding:
  max_holding_bars: 0
  time_stop_bars: 0
stop_loss:
  breakeven:
    enabled: false
  guardrails:
    max_stop_pct: 0.12
    min_stop_pct: 0.005
  initial_r: 2.0
  structural_exit: null
  trailing:
    activation_r: 1.5
    enabled: true
    expand_with_primary_atr: true
    trail_r: 1.5
  type: trailing
take_profit:
  enabled: false
version: 2
