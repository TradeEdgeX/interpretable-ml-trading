<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>实验管理 · MLBot Lab</title>
  <link rel="stylesheet" href="/static/lab.css"/>
</head>
<body>
  <div class="wrap">
    <nav class="top-nav" aria-label="Lab">
      <span class="brand">MLBot Lab</span>
      <a href="/rd" class="active">实验管理</a>
      <a href="/rd/qa">问答</a>
      <a href="/browse">浏览 results</a>
    </nav>
    <header>
      <h1>实验管理</h1>
      <p class="subhead">只读 <code>config/experiments/</code>。不含 A股 / 港股 / 币圈辅助，也不含 CMS。</p>
      <div class="toolbar">
        <label>策略 <select id="strategyFilter"><option value="">全部</option></select></label>
        <label>搜索 <input id="searchInput" type="search" placeholder="topic / 假设 / id"/></label>
        <label><input id="decisionOnly" type="checkbox"/> 仅有 DECISION</label>
        <button id="refreshBtn" type="button">刷新</button>
        <span id="statusLine" class="muted">—</span>
      </div>
    </header>
    <div class="layout">
      <div class="pane list-pane">
        <table>
          <thead>
            <tr><th>日期</th><th>策略</th><th>实验</th><th>记分卡</th><th>决策</th></tr>
          </thead>
          <tbody id="rdBody"><tr><td colspan="5" class="muted">加载中…</td></tr></tbody>
        </table>
      </div>
      <aside class="pane detail-pane" id="detailPane">
        <p class="muted">点击左侧实验查看详情</p>
      </aside>
    </div>
  </div>
  <script defer src="/static/rd.js"></script>
</body>
</html>
