name: Deploy teaching site

on:
  push:
    branches: [main, master]
    paths:
      - "website/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: website/requirements.txt
      - name: Install MkDocs
        run: pip install -r website/requirements.txt
      - name: Build site
        working-directory: website
        run: |
          mkdocs build --strict
          python -c "
          from pathlib import Path
          html = '''<!doctype html>
          <html lang=\"en\">
          <head>
          <meta charset=\"utf-8\">
          <meta http-equiv=\"refresh\" content=\"0; url=/interpretable-ml-trading/\">
          <link rel=\"canonical\" href=\"https://tradeedgex.github.io/interpretable-ml-trading/\">
          <title>Redirecting</title>
          <script>
          (function () {
            var rest = location.pathname.replace(/^\\/interpretable-ml-trading\\/en\\/?/, \"/\")
              .replace(/^\\/en\\/?/, \"/\");
            location.replace(\"/interpretable-ml-trading\" + rest + location.search + location.hash);
          })();
          </script>
          </head>
          <body><p><a href=\"/interpretable-ml-trading/\">Continue to the English site</a></p></body>
          </html>
          '''
          dest = Path('site/en')
          dest.mkdir(parents=True, exist_ok=True)
          (dest / 'index.html').write_text(html, encoding='utf-8')
          "
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
